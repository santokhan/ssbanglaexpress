# /etc/nginx/sites-available/ssbanglaexpress.com.conf
server {
    listen 80;
    server_name ssbanglaexpress;
    
    location / {
        # Proxy requests to the Next.js server
        proxy_pass http://localhost:3000; # Adjust this if your Next.js server runs on a different port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
